<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#104a3c"/>
      <stop offset="50%" stop-color="#176451"/>
      <stop offset="100%" stop-color="#2ab692"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#176451" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Hub Emblem -->
  <g filter="url(#glow)">
    <rect x="4" y="8" width="48" height="48" rx="14" fill="url(#hubGrad)"/>
    <!-- Central Node -->
    <circle cx="28" cy="32" r="7" fill="#ffffff"/>
    <circle cx="28" cy="32" r="3.5" fill="#176451"/>
    <!-- Orbital Nodes & Connectors -->
    <path d="M28 17 V21 M28 43 V47 M13 32 H17 M39 32 H43" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="28" cy="15" r="2.5" fill="#a7f3d0"/>
    <circle cx="28" cy="49" r="2.5" fill="#a7f3d0"/>
    <circle cx="11" cy="32" r="2.5" fill="#a7f3d0"/>
    <circle cx="45" cy="32" r="2.5" fill="#a7f3d0"/>
  </g>
  <!-- Wordmark -->
  <text x="64" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#14221d" letter-spacing="-0.5">SpaceHub</text>
  <rect x="180" y="21" width="34" height="20" rx="6" fill="#176451"/>
  <text x="187" y="35" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="11" fill="#ffffff" letter-spacing="1">UZ</text>
</svg>
