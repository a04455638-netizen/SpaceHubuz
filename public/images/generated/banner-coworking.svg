<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <defs>
    <linearGradient id="bgCowork" x1="0" y1="0" x2="800" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f2922"/>
      <stop offset="100%" stop-color="#174f41"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8e2d5"/>
      <stop offset="100%" stop-color="#cfc7b6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="20" fill="url(#bgCowork)"/>
  <!-- Modern Architectural Glass Wall -->
  <path d="M50 40 H750 V260 H50 Z" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <line x1="280" y1="40" x2="280" y2="260" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <line x1="520" y1="40" x2="520" y2="260" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- Ambient Hanging Plants & Lighting -->
  <circle cx="200" cy="50" r="12" fill="#2ab692" fill-opacity="0.4"/>
  <line x1="200" y1="0" x2="200" y2="50" stroke="#2ab692" stroke-width="2"/>
  <circle cx="600" cy="65" r="16" fill="#2ab692" fill-opacity="0.4"/>
  <line x1="600" y1="0" x2="600" y2="65" stroke="#2ab692" stroke-width="2"/>
  <!-- Desks and Workspaces -->
  <rect x="120" y="240" width="220" height="120" rx="8" fill="url(#deskGrad)"/>
  <rect x="460" y="240" width="220" height="120" rx="8" fill="url(#deskGrad)"/>
  <!-- Laptops & Monitors -->
  <rect x="180" y="210" width="70" height="45" rx="4" fill="#14221d"/>
  <rect x="185" y="215" width="60" height="35" rx="2" fill="#2ab692" fill-opacity="0.6"/>
  <rect x="520" y="200" width="100" height="60" rx="5" fill="#14221d"/>
  <rect x="525" y="205" width="90" height="48" rx="3" fill="#38bdf8" fill-opacity="0.5"/>
  <!-- Ergonomic Chairs -->
  <path d="M195 270 Q215 250 235 270 V320 H195 Z" fill="#20352f"/>
  <path d="M550 270 Q570 250 590 270 V320 H550 Z" fill="#20352f"/>
  <!-- Badge Label -->
  <rect x="40" y="320" width="210" height="42" rx="10" fill="#104a3c"/>
  <text x="56" y="347" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#a7f3d0">Kovorking &amp; Study</text>
</svg>
