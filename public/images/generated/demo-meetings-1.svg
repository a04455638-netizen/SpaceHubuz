  <rect width="600" height="400" rx="16" fill="url(#mt1)"/>
  <!-- Executive 4K Conference Display -->
  <rect x="180" y="60" width="240" height="130" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
