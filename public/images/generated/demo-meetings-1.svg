  <circle cx="250" cy="125" r="22" fill="#38bdf8" fill-opacity="0.3"/>
  <path d="M250 115 L250 135 M240 125 L260 125" stroke="#ffffff" stroke-width="2"/>
  <rect x="300" y="105" width="80" height="8" rx="2" fill="#e0f2fe"/>
  <rect x="300" y="122" width="60" height="6" rx="2" fill="#bae6fd"/>
